[project]
name = "digital-twin-manufacturing"
version = "1.0.0"
description = "Web-Based Digital Twin for Real-Time Manufacturing Bottleneck Analysis and Parallel Machine Allocation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pymysql>=1.1.1",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.2",
    "aiofiles>=24.1.0",
    "websockets>=13.1",
    "cryptography>=43.0.3",
]

[tool.vercel]
entrypoint = "backend.main:app"
